<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: model-driven shell — top bar, left sitemap, command bar over a form or grid. Paper-white sheet for the printed format. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#eaefed; --line:#d5ddda; --fg:#16201d; --muted:#596864;
  --accent:#0d6656; --accent-fg:#ffffff; --accent-soft:#d9ede7;
  --nav:#13221e; --nav-fg:#d6e2de; --nav-muted:#8ea29c;
  --ok:#1b7a3d; --ok-soft:#dcf1e3; --warn:#9a5800; --warn-soft:#fbeacd; --bad:#b0261d; --bad-soft:#f8dedb; --info:#2455a3; --info-soft:#dfe8f8;
  --sheet:#ffffff; --sheet-fg:#111111; --sheet-line:#c8c8c8; --sheet-band:#e4e4e4; --sheet-mark:#d9ede7;
  --shadow:0 10px 30px rgba(10,30,25,.18);
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-sheet:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#16201c; --surface-2:#1d2925; --line:#2b3a35; --fg:#e3ebe8; --muted:#98aaa4;
  --accent:#55bca2; --accent-fg:#05231b; --accent-soft:#163a31;
  --nav:#090f0d; --nav-fg:#cddad5; --nav-muted:#7b8f89;
  --ok:#6cc68b; --ok-soft:#163522; --warn:#e4a64c; --warn-soft:#382811; --bad:#f07e74; --bad-soft:#3c1916; --info:#88aae9; --info-soft:#19263f;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#16201c; --surface-2:#1d2925; --line:#2b3a35; --fg:#e3ebe8; --muted:#98aaa4;
  --accent:#55bca2; --accent-fg:#05231b; --accent-soft:#163a31;
  --nav:#090f0d; --nav-fg:#cddad5; --nav-muted:#7b8f89;
  --ok:#6cc68b; --ok-soft:#163522; --warn:#e4a64c; --warn-soft:#382811; --bad:#f07e74; --bad-soft:#3c1916; --info:#88aae9; --info-soft:#19263f;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#root{height:100%}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:9px 16px;background:var(--nav);color:var(--nav-fg)}
.brand{font-weight:700;font-size:15px;letter-spacing:.005em}
.sim{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;border:1px dashed var(--nav-muted);padding:2px 8px;border-radius:3px}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--nav-muted)}
.spacer{flex:1}
.top select,.top .tbtn{background:transparent;color:var(--nav-fg);border:1px solid #ffffff33;border-radius:4px;padding:5px 9px;cursor:pointer}
.top select option{color:#111;background:#fff}
.top .tbtn:hover{background:#ffffff14}
.menu-btn{display:none}
.searchbar{display:flex;gap:6px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.searchbar input{flex:1;min-width:0;max-width:520px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.searchbar .hint{color:var(--muted);font-size:12px}
.body{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:0}
.nav{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:6px 8px 20px}
.nav h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 10px 6px;font-weight:600}
.nav button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border:0;background:none;border-radius:4px;text-align:left;cursor:pointer}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:9px;background:var(--surface-2);color:var(--muted)}
.count.bad{background:var(--bad-soft);color:var(--bad)}
.main{overflow:auto;min-width:0}
.cmdbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.content{padding:16px 20px 40px;display:grid;gap:16px;align-content:start}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.outline{border-color:var(--line);background:var(--surface)}
.btn.danger{color:var(--bad)}

.pagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.pagehead h1{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.pagehead .sub{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.ask{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--info);background:var(--info-soft);border:1px dashed var(--info);border-radius:3px;padding:0 6px;cursor:pointer;letter-spacing:.01em;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px}
.field{min-width:0}
.field label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:3px}
.field .v{padding:6px 0;min-height:32px;overflow-wrap:anywhere}
.field input,.field select,.field textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.field input[readonly],.field textarea[readonly]{background:var(--surface-2);border-color:transparent}
.field.wide{grid-column:1/-1}
.field .err{color:var(--bad);font-size:12px;margin-top:3px}
.field .warnmsg{color:var(--warn);font-size:12px;margin-top:3px}
.req{color:var(--bad)}
.lock{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 4px}
.mono{font-family:var(--f-mono);font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--muted)}
.note{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}
.note.bad{background:var(--bad-soft);border-color:transparent}
.note.info{background:var(--info-soft);border-color:transparent}
.note b{font-weight:600}
.views{display:flex;flex-wrap:wrap;gap:4px}
.views button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.views button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.grid{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid tr.click{cursor:pointer}
.grid tr.click:hover td{background:var(--accent-soft)}
.grid tr.tot td{font-weight:700;background:var(--surface-2)}
.grid .nowrap{white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.timeline{display:grid;gap:10px}
.mail{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--surface);min-width:0}
.mail.out{background:var(--accent-soft);border-color:transparent}
.mail .mh{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.mail .subj{font-weight:600;margin-bottom:4px}
.mail .bodytext{white-space:pre-wrap;overflow-wrap:anywhere}
.editor{border:1px solid var(--accent);border-radius:6px;padding:12px;background:var(--surface);display:grid;gap:8px}
.editor .row{display:flex;gap:8px;font-size:13px;flex-wrap:wrap}
.editor .row span:first-child{color:var(--muted);width:56px}
.editor textarea{width:100%;min-height:130px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile.alert .n{color:var(--bad)}
.chart text{fill:var(--fg);font-family:var(--f-body);font-size:12px}
.chart .lbl{fill:var(--muted)}
.chart .grid-l{stroke:var(--line)}
.chart .bar{fill:var(--accent)}
.back{position:fixed;inset:0;background:rgba(5,15,12,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;min-width:0}
.modal.wide{max-width:1040px}
.modal .mhd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}
.modal .mhd h2{margin:0;font-size:16px}
.modal .mbd{padding:16px 18px;overflow:auto;display:grid;gap:12px}
.modal .mft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);max-width:min(620px,calc(100% - 32px));font-size:13px}
.toast.bad{background:var(--bad);color:var(--bg)}
.toast.info{background:var(--info);color:var(--bg)}
/* Printed format preview: paper is white in both themes */
.paper{background:var(--sheet);color:var(--sheet-fg);font-family:var(--f-sheet);font-size:11.5px;border:1px solid var(--sheet-line);border-radius:2px;position:relative;overflow-x:auto;padding:14px}
.paper::after{content:"SIMULADO · SIN VALIDEZ";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:46px;font-weight:700;color:rgba(176,38,29,.10);letter-spacing:.08em;pointer-events:none;white-space:nowrap}
table.sheet{border-collapse:collapse;width:100%;min-width:720px;table-layout:fixed}
.sheet td,.sheet th{border:1px dotted var(--sheet-line);padding:3px 5px;vertical-align:top;height:20px;overflow-wrap:anywhere;color:var(--sheet-fg)}
.sheet th{background:#f1f1f1;font-weight:400;color:#666;font-size:10px;text-align:center}
.sheet th.rn{width:34px}
.sheet .lbl{font-weight:700}
.sheet .title{font-weight:700;font-size:13px;text-align:center}
.sheet .title2{font-weight:700;text-align:center;letter-spacing:.04em}
.sheet .band{font-weight:700;background:var(--sheet-band)}
.sheet .clause{font-size:10.5px;line-height:1.35}
.sheet .small{font-size:10px;color:#333}
.sheet .val{background:#ffffff}
.sheet.coords .val{background:var(--sheet-mark)}
.sheet .coord{display:block;font-family:var(--f-mono);font-size:9px;color:#0d6656}
.sheet .hdr{font-weight:700;background:var(--sheet-band);text-align:center}
.sheet .gap td{height:8px;border-color:transparent}
.sheet .cleared td{font-style:italic;color:#777;text-align:center;background:#fafafa}
.sheet .sig{padding-top:26px;border-top:0}
.qlist{display:grid;gap:10px;counter-reset:q}
.q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.q .qt{font-weight:600}
.q .qd{color:var(--muted);font-size:13px}
.inline-pay{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inline-pay input{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);width:140px}
.maprow input,.maprow select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);max-width:100%}
.maprow input{width:70px;font-family:var(--f-mono)}
.list-errors{margin:0;padding-left:18px}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.att{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px;background:var(--surface);color:var(--fg);max-width:100%}
.att .ext{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--accent);text-transform:uppercase}
.att .sz{color:var(--muted)}
.att button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs figure{margin:0;display:grid;gap:2px;font-size:11px;color:var(--muted)}
.thumbs img{max-width:160px;max-height:120px;border-radius:4px;border:1px solid var(--line);object-fit:cover}
.thumbs .ph{width:160px;height:90px;border-radius:4px;border:1px dashed var(--line);display:grid;place-items:center;background:var(--surface-2)}
label.btn input[type=file]{display:none}
@media (max-width:860px){
  .menu-btn{display:inline-flex}
  .body{grid-template-columns:minmax(0,1fr)}
  .nav{display:none;border-right:0;border-bottom:1px solid var(--line)}
  .nav.open{display:block}
  .cols{grid-template-columns:minmax(0,1fr)}
  .content{padding:14px 16px 40px}
  .cmdbar{padding:6px 16px}
}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .18s ease-out} @keyframes up{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}} }
</style>

<script>
const { useState, useEffect, createContext, useContext } = React;
const html = htm.bind(React.createElement);

/* ---------- Reloj simulado y formato ---------- */
const T0 = Date.now();
const SIM = new Date(2026, 9, 7, 10, 30, 0).getTime();
const now = () => new Date(SIM + (Date.now() - T0));
const D = s => { const [d, t] = s.split(' '); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = (t || '0:0').split(':').map(Number); return new Date(y, m - 1, dd, h, mi); };
const pad = n => String(n).padStart(2, '0');
const fd = d => d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : '';
const fdt = d => d ? `${fd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
const iso = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : '';
const n2 = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => (n === null || n === undefined || n === '') ? '' : 'C$ ' + n2(n);
const dur = min => { min = Math.max(0, Math.round(min)); if (min < 60) return `${min} min`; const h = Math.floor(min / 60), m = min % 60; if (h < 24) return `${h} h ${pad(m)} min`; return `${Math.floor(h / 24)} d ${h % 24} h`; };
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addMonths = (d, k) => { const y = d.getFullYear(), m = d.getMonth() + k, last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(d.getDate(), last)); };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9@.]/g, '');
const fakeHash = s => { let h = 2166136261, out = ''; for (let r = 0; r < 8; r++) { for (const ch of s + r) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } out += h.toString(16).padStart(8, '0'); } return out; };
const avg = xs => xs.length ? xs.reduce((t, x) => t + x, 0) / xs.length : null;
const fsize = b => b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1048576).toFixed(1)} MB`;
const ext = n => (String(n).match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
// Límite del entorno (Organization.MaxUploadFileSize): 5 MB por defecto, medido sobre el Base64 del archivo.
const MAX_B64 = 5 * 1024 * 1024;
const BLOQUEADAS = ['exe', 'bat', 'cmd', 'com', 'js', 'jse', 'vbs', 'vbe', 'ps1', 'msi', 'scr', 'dll', 'jar', 'reg', 'lnk', 'hta', 'url'];
const IMG_OK = ['png', 'jpg', 'jpeg', 'gif'];

/* ---------- Usuarios simulados ---------- */
const USERS = {
  o1: { id: 'o1', nombre: 'Mariela Gutiérrez', rol: 'Oficial' },
  o2: { id: 'o2', nombre: 'Carlos Aráuz', rol: 'Oficial' },
  o3: { id: 'o3', nombre: 'Lucía Pérez', rol: 'Oficial' },
  j1: { id: 'j1', nombre: 'Ramón Téllez', rol: 'Jefe' },
};
const OFICIALES = ['o1', 'o2', 'o3'];
const uname = id => USERS[id]?.nombre || '—';
const BUZON = 'arreglosdepago@banco.ejemplo';

/* ---------- Campos mapeables (choice global, lo mantiene el equipo) ---------- */
const FIELDS = [
  ['fechaFormalizacion', 'Fecha de formalización', 'simple'], ['oficial', 'Oficial de arreglo', 'simple'],
  ['clienteNombre', 'Nombre del cliente', 'simple'], ['clienteCedula', 'Cédula del cliente', 'simple'],
  ['clienteCorreo', 'Correo del cliente', 'simple'], ['clienteCelular', 'Celular del cliente', 'simple'],
  ['numeroProducto', 'Número de préstamo o tarjeta', 'simple'], ['tipo', 'Tipo de arreglo', 'simple'],
  ['numeroArreglo', 'Número de arreglo', 'simple'], ['saldoInicial', 'Saldo inicial', 'simple'],
  ['montoAbonado', 'Monto abonado', 'simple'], ['saldoRemanente', 'Saldo remanente', 'simple'],
  ['plazo', 'Plazo (cuotas)', 'simple'], ['cuota', 'Cuota mensual', 'simple'], ['totalPagar', 'Total a pagar', 'simple'],
  ['fechaInicio', 'Fecha de inicio', 'simple'], ['fechaFin', 'Fecha de finalización', 'simple'],
  ['cuentaDebitar', 'Cuenta a debitar', 'simple'], ['comentarios', 'Comentarios', 'simple'],
  ['cuota.numero', 'Cuota: número', 'bloque'], ['cuota.fecha', 'Cuota: fecha de vencimiento', 'bloque'],
  ['cuota.monto', 'Cuota: monto', 'bloque'], ['cuota.fechaPago', 'Cuota: fecha de pago', 'bloque'],
  ['cuota.montoPagado', 'Cuota: monto pagado', 'bloque'],
  ['total.montoCuotas', 'Total: montos de cuota', 'total'], ['total.montoPagado', 'Total: montos pagados', 'total'],

/* ---------- Contexto y piezas comunes ---------- */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

function Ask({ id }) {
  const { go } = useApp();
  return html`<span className="ask" role="button" tabIndex="0" title="Regla a confirmar con negocio" onClick=${e => { e.stopPropagation(); go({ p: 'preguntas', focus: id }); }} onKeyDown=${e => { if (e.key === 'Enter') go({ p: 'preguntas', focus: id }); }}>A confirmar</span>`;
}
function Chip({ k, children }) { return html`<span className=${'chip ' + (k || '')}>${children}</span>`; }
const RES_K = { 'Con arreglo de pago': 'ok', 'Sin arreglo de pago': '', 'Sin respuesta': '' };
function convChips(s, i) {
  const out = [];
  if (s.estado === 'Abierta') out.push(i.pend ? html`<${Chip} key="e" k="warn">Pendiente de respuesta</${Chip}>` : html`<${Chip} key="e" k="info">Esperando al cliente</${Chip}>`);
  else if (s.estado === 'Finalizada') out.push(html`<${Chip} key="e" k=${RES_K[s.resultado]}>Finalizada · ${s.resultado}</${Chip}>`);
  else out.push(html`<${Chip} key="e">Unida a otra</${Chip}>`);
  if (i.nuevos.length) out.push(html`<${Chip} key="n" k="bad">Correo nuevo</${Chip}>`);
  if (i.error) out.push(html`<${Chip} key="x" k="bad">Error de envío</${Chip}>`);
  return html`<div className="chips">${out}</div>`;
}
const estadoArrChip = a => {
  const m = { Vigente: 'acc', Terminado: 'ok', Anulado: 'bad', Borrador: 'warn', Descartado: '' };
  return html`<span className="chips"><${Chip} k=${m[a.estado]}>${a.estado}</${Chip}>${a.estado === 'Borrador' && a.congelado ? html`<${Chip} k="info">Pendiente de firma</${Chip}>` : null}</span>`;
};
const ageChip = min => html`<${Chip} k=${min > 480 ? 'bad' : min > 120 ? 'warn' : ''}>${dur(min)}</${Chip}>`;

function Field({ label, children, wide, extra }) {
  return html`<div className=${'field' + (wide ? ' wide' : '')}><label>${label}${extra}</label>${children}</div>`;
}
function Grid({ cols, rows, onOpen, empty, foot }) {
  if (!rows.length) return html`<div className="gridwrap"><div className="empty">${empty}</div></div>`;
  return html`<div className="gridwrap"><table className="grid"><thead><tr>${cols.map((c, i) => html`<th key=${i} className=${c.num ? 'num' : ''}>${c.h}</th>`)}</tr></thead>
    <tbody>${rows.map((r, ri) => html`<tr key=${r.id || ri} className=${onOpen ? 'click' : ''} onClick=${onOpen ? () => onOpen(r) : null}>${cols.map((c, i) => html`<td key=${i} className=${(c.num ? 'num ' : '') + (c.cls || '')}>${c.r(r)}</td>`)}</tr>`)}${foot}</tbody></table></div>`;
}
function Modal({ title, children, foot, onClose, wide }) {
  useEffect(() => { const k = e => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  return html`<div className="back" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className=${'modal' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${title}>
      <div className="mhd"><h2>${title}</h2><button className="btn" onClick=${onClose} aria-label="Cerrar">✕</button></div>
      <div className="mbd">${children}</div>
      ${foot && html`<div className="mft">${foot}</div>`}
    </div></div>`;
}
function ViewChips({ views, cur, onPick, count }) {
  return html`<div className="views">${views.map(x => html`<button key=${x[0]} className=${x[0] === cur ? 'on' : ''} onClick=${() => onPick(x[0])}>${x[1]} <span className="count">${count(x)}</span></button>`)}</div>`;
}

/* ---------- Bandeja de conversaciones ---------- */
function Bandeja({ v }) {
  const { db, uid, go } = useApp();
  const info = new Map(db.solicitudes.map(s => [s.id, convInfo(s)]));
  const I = s => info.get(s.id);
  const VIEWS = [
    ['mias', 'Mis pendientes', s => s.asignado === uid && needsAttention(s, I(s))],
    ['sinasignar', 'Sin asignar', s => s.estado === 'Abierta' && !s.asignado],
    ['pendientes', 'Pendientes de respuesta', s => needsAttention(s, I(s))],
    ['esperando', 'Esperando al cliente', s => s.estado === 'Abierta' && !I(s).pend],
    ['decision', 'Correo en finalizadas', s => I(s).nuevos.length > 0],
    ['finalizadas', 'Finalizadas', s => s.estado === 'Finalizada'],
    ['todas', 'Todas', s => s.estado !== 'Unida'],
  ];
  const cur = VIEWS.find(x => x[0] === v) || VIEWS[1];
  const since = s => I(s).pend || I(s).nuevos[0]?.fecha;
  const pendView = ['mias', 'pendientes', 'decision'].includes(cur[0]);
  const rows = db.solicitudes.filter(cur[2]).sort((a, b) => pendView ? since(a) - since(b) : b.llegada - a.llegada);
  const cli = id => db.clientes.find(c => c.id === id);
  return html`<div className="content">
    <div className="pagehead"><h1>Conversaciones</h1><span className="sub">Cada conversación agrupa los correos de ida y vuelta con un cliente.</span></div>
    <${ViewChips} views=${VIEWS} cur=${cur[0]} onPick=${k => go({ p: 'bandeja', v: k })} count=${x => db.solicitudes.filter(x[2]).length} />
    ${cur[0] === 'decision' && html`<div className="note warn">Llegaron correos a conversaciones ya finalizadas. Cada una espera que alguien decida si se reabre o si se inicia una conversación nueva. Hasta entonces cuentan como pendientes.</div>`}
    <${Grid} rows=${rows} onOpen=${s => go({ p: 'sol', id: s.id })}
      empty=${html`<b>No hay conversaciones en esta vista.</b>${pendView ? 'Todos los correos de esta vista tienen respuesta.' : ''}`}
      cols=${[
        { h: 'Primer correo', r: s => html`<span className="nowrap">${fdt(s.llegada)}</span>` },
        { h: 'N.º', r: s => html`<span className="mono">${s.num}</span>` },
        { h: 'Remitente', r: s => { const c = cli(s.clienteId); return c ? c.nombre : html`<span>${s.mails[0].de}</span> <${Chip} k="info">No registrado</${Chip}>`; } },
        { h: 'Asunto', r: s => s.mails[0].asunto },
        { h: 'Correos', num: true, r: s => s.mails.length },
        { h: 'Oficial', r: s => s.asignado ? uname(s.asignado) : html`<span className="muted">Sin asignar</span>` },
        { h: 'Estado', r: s => convChips(s, I(s)) },
        { h: 'Sin respuesta desde / tiempo total', r: s => { const i = I(s); return since(s) && needsAttention(s, i) ? ageChip((now() - since(s)) / 60000) : i.total != null ? html`<span className="muted">Total</span> ${dur(i.total)}` : html`<span className="muted">—</span>`; } },
      ]} />
  </div>`;
}

      if (BLOQUEADAS.includes(e)) bad.push(`${fl.name}: el tipo .${e} está bloqueado en el entorno`);
      else if (asImage && !IMG_OK.includes(e)) bad.push(`${fl.name}: como imagen en el texto solo se admite PNG, JPG o GIF`);
      else if (Math.ceil(fl.size / 3) * 4 > MAX_B64) bad.push(`${fl.name}: pesa ${fsize(fl.size)} y el máximo es unos 3,7 MB por archivo`);
      else ok.push({ name: fl.name, size: fl.size, url: asImage ? URL.createObjectURL(fl) : null });
    });
    if (asImage) setImgs(x => [...x, ...ok]); else setAdj(x => [...x, ...ok]);
    if (bad.length) say('No se agregó: ' + bad.join('; ') + '.', 'bad');
  };
  const closeEditor = () => { setReply(null); setAdj([]); setImgs([]); };
  if (s.estado === 'Unida') { const t = db.solicitudes.find(x => x.id === s.unidaA); return html`<div className="content"><div className="note">Esta conversación se unió a <a href="#" onClick=${e => { e.preventDefault(); go({ p: 'sol', id: t.id }); }}>${t.num}</a>. Sus correos están ahí.</div></div>`; }
  const i = convInfo(s);
  const c = db.clientes.find(x => x.id === s.clienteId);
  const abierta = s.estado === 'Abierta';
  const arrs = db.arreglos.filter(a => a.solicitudId === s.id);
  const sending = s.mails.some(m => m.estado === 'Pendiente de envío');
  const otras = abierta ? db.solicitudes.filter(x => x.id !== s.id && x.estado === 'Abierta' && (x.mails[0].de === s.mails[0].de || (s.clienteId && x.clienteId === s.clienteId))) : [];
  const roundBy = Object.fromEntries(i.rounds.map(r => [r.id, r.min]));

  const tomar = () => {
    if (s.carrera) {
      mut(n => { const t = n.solicitudes.find(x => x.id === id); t.asignado = 'o2'; t.carrera = false; n.audit.push({ fecha: now(), uid: 'o2', ent: 'sol', id, texto: 'Tomó la conversación' }); });
      say('Carlos Aráuz tomó esta conversación un instante antes. Se muestra su asignación; nadie pisó el cambio del otro.', 'bad'); return;
    }
    mut(n => { n.solicitudes.find(x => x.id === id).asignado = uid; log(n, 'sol', id, 'Tomó la conversación'); });
    say('Conversación tomada. Todo el área ve que es suya.');
  };
  const enviar = texto => {
    const mid = 'e' + Date.now(); const pendAt = i.pend; const a1 = adj.map(({ name, size }) => ({ name, size })), i1 = imgs.map(({ name, size, url }) => ({ name, size, url }));
    mut(n => { const t = n.solicitudes.find(x => x.id === id); t.mails.push({ id: mid, dir: 'out', de: BUZON, para: t.mails[0].de, asunto: 'RE: ' + t.mails[0].asunto, cuerpo: texto, fecha: now(), estado: 'Pendiente de envío', por: uid, adjuntos: a1, imagenes: i1 }); });
    closeEditor();
    say('Respuesta en cola. Sale desde el buzón del área en el próximo ciclo de sincronización.', 'info');
    setTimeout(() => {
      mut(n => { const t = n.solicitudes.find(x => x.id === id); const m = t.mails.find(x => x.id === mid); m.estado = 'Enviado'; m.fecha = now(); log(n, 'sol', id, 'Respondió al cliente desde el buzón del área'); });
      say(pendAt ? `Respuesta enviada en ${dur((now() - pendAt) / 60000)}. La conversación queda esperando al cliente.` : 'Respuesta enviada. La conversación queda esperando al cliente.');
    }, 2600);
  };
  const reabrir = () => { mut(n => { const t = n.solicitudes.find(x => x.id === id); log(n, 'sol', id, `Reabrió la conversación (estaba finalizada: ${t.resultado})`); t.estado = 'Abierta'; t.resultado = null; t.fin = null; }); say('Conversación reabierta.'); };
  const nueva = () => {
    let nid;
    mut(n => { const t = n.solicitudes.find(x => x.id === id); const k = ++n.seq.sol; nid = 's' + k; const moved = t.mails.filter(m => m.dir === 'in' && m.fecha > t.fin.fecha);
      t.mails = t.mails.filter(m => !moved.includes(m));
      n.solicitudes.push({ id: nid, num: 'SOL-0' + k, estado: 'Abierta', resultado: null, fin: null, asignado: t.asignado, clienteId: t.clienteId, carrera: false, unidaA: null, llegada: moved[0].fecha, mails: moved.map(m => ({ ...m, asunto: m.asunto.replace(/^RE: /, '') })) });
      log(n, 'sol', id, `Movió el correo nuevo a la conversación ${'SOL-0' + k}`); log(n, 'sol', nid, `Conversación iniciada con un correo que llegó a ${t.num}`); });
    say('Se inició una conversación nueva con ese correo. La anterior sigue finalizada.');
    setTimeout(() => go({ p: 'sol', id: nid }), 0);
  };

  return html`<div>
    <div className="cmdbar">
      <button className="btn" onClick=${() => go({ p: 'bandeja', v: 'pendientes' })}><span className="ic">←</span> Conversaciones</button>
      <button className="btn" disabled=${!abierta || !!s.asignado} onClick=${tomar}>Tomar</button>
      <button className="btn" disabled=${!abierta || !isJefe} title=${isJefe ? '' : 'Solo la jefatura reasigna'} onClick=${() => setModal({ k: 'reasignar', id })}>Reasignar${!isJefe ? html` <span className="muted">(jefatura)</span>` : null}</button>
      <button className="btn" disabled=${!abierta || reply !== null || sending} onClick=${() => setReply(`Estimado(a) ${c ? c.nombre.split(' ')[0] : 'cliente'}:\n\n`)}>Responder</button>
      <button className="btn" disabled=${!abierta} onClick=${() => setModal({ k: 'finalizar', id })}>Finalizar</button>
      <button className="btn" disabled=${!abierta} onClick=${() => setModal({ k: 'unir', id })}>Unir a otra conversación</button>
      ${s.estado === 'Finalizada' && !i.nuevos.length && html`<button className="btn" onClick=${reabrir}>Reabrir</button>`}
      <button className="btn" disabled=${!c} title=${c ? '' : 'Primero vincule o cree el cliente'} onClick=${() => go({ p: 'arregloNuevo', clienteId: c.id, solicitudId: s.id })}>Registrar arreglo</button>
    </div>
    <div className="content">
      <div className="pagehead"><h1>${s.mails[0].asunto}</h1><span className="sub mono">${s.num}</span>${convChips(s, i)}</div>
      ${i.nuevos.length > 0 && html`<div className="note bad"><b>Llegó un correo nuevo a esta conversación finalizada</b> (${fdt(i.nuevos[0].fecha)}). Decida qué hacer con él; mientras tanto cuenta como pendiente de respuesta.
        <div className="chips" style=${{ marginTop: 8 }}><button className="btn outline" onClick=${reabrir}>Reabrir esta conversación</button><button className="btn outline" onClick=${nueva}>Iniciar conversación nueva con ese correo</button></div></div>`}
      ${otras.length > 0 && html`<div className="note info">Este cliente tiene otra conversación abierta: ${otras.map((o, k) => html`<span key=${o.id}>${k ? ', ' : ''}<a href="#" onClick=${e => { e.preventDefault(); go({ p: 'sol', id: o.id }); }}>${o.num}</a> "${o.mails[0].asunto}"</span>`)}. Si es el mismo tema, únalas.
        <div style=${{ marginTop: 8 }}><button className="btn outline" onClick=${() => setModal({ k: 'unir', id })}>Unir a otra conversación</button></div></div>`}
      <div className="cols">
        <div style=${{ display: 'grid', gap: 16, minWidth: 0 }}>
          <div className="panel"><h3>Conversación</h3>
            <div className="form">
              <${Field} label="Primer correo"><div className="v">${fdt(s.llegada)}</div></${Field}>
              <${Field} label="Oficial asignado"><div className="v">${s.asignado ? uname(s.asignado) : html`<span className="muted">Sin asignar</span>`}</div></${Field}>
              ${i.pend && html`<${Field} label="Correo sin respuesta desde"><div className="v">${ageChip((now() - i.pend) / 60000)}</div></${Field}>`}
              <${Field} label="Primera respuesta"><div className="v">${i.first != null ? dur(i.first) : html`<span className="muted">—</span>`}</div></${Field}>
              <${Field} label="Respuestas enviadas"><div className="v">${i.rounds.length}${i.rounds.length ? html` <span className="muted">· promedio ${dur(avg(i.rounds.map(r => r.min)))}</span>` : ''}</div></${Field}>
              ${s.fin && html`<${Field} label="Tiempo total"><div className="v">${dur(i.total)} <span className="muted">(del primer correo a la finalización)</span></div></${Field}>`}
              ${s.fin && html`<${Field} label="Finalizada" wide><div className="v"><b>${s.resultado}</b>${s.fin.motivo ? ` · ${s.fin.motivo}. ${s.fin.detalle || ''}` : ''} <span className="muted">· ${uname(s.fin.uid)}, ${fdt(s.fin.fecha)}</span></div></${Field}>`}
            </div>
          </div>
          <div className="panel"><h3>Cliente</h3>
            ${c ? html`<div className="form">
                <${Field} label="Nombre"><div className="v"><a href="#" onClick=${e => { e.preventDefault(); go({ p: 'cliente', id: c.id }); }}>${c.nombre}</a></div></${Field}>
                <${Field} label="Cédula"><div className="v mono">${c.cedula}</div></${Field}>
                <${Field} label="Correo"><div className="v">${c.correo}</div></${Field}>
              </div>`
            : html`<div className="note info">El remitente <b>${s.mails[0].de}</b> todavía no es cliente. La conversación se registró igual.</div>
              <div className="chips" style=${{ marginTop: 10 }}>
                <button className="btn outline" onClick=${() => setModal({ k: 'vincular', id })}>Vincular cliente existente</button>
                <button className="btn outline" onClick=${() => go({ p: 'clienteNuevo', correo: s.mails[0].de, fromSol: s.id })}>Crear cliente</button>
              </div>`}
          </div>
          <div className="panel"><h3>Arreglos de esta conversación</h3>
            <${Grid} rows=${arrs} onOpen=${a => go({ p: 'arreglo', id: a.id })} empty=${html`<b>Sin arreglos.</b>Use "Registrar arreglo" para preparar un borrador.`}
              cols=${[{ h: 'Producto', r: a => `${a.producto} ${a.numeroProducto}` }, { h: 'N.º', r: a => a.numeroArreglo ?? html`<span className="muted">—</span>` }, { h: 'Estado', r: estadoArrChip }]} />
          </div>
        </div>
        <div className="panel"><h3>Correos (${s.mails.length}) <span className="muted" style=${{ textTransform: 'none', letterSpacing: 0, fontWeight: 400 }}>· más reciente arriba</span></h3>
          <div className="timeline">
            ${reply !== null && html`<div className="editor">
              <div className="row"><span>De</span><span>Buzón Arreglos de Pago &lt;${BUZON}&gt;</span></div>
              <div className="row"><span>Para</span><span>${s.mails[0].de}</span></div>
              <div className="row"><span>Asunto</span><span>RE: ${s.mails[0].asunto}</span></div>
              ${!s.asignado && html`<div className="note warn">La conversación no tiene oficial asignado. <${Ask} id="responder" /></div>`}
              <textarea id="reply-body" value=${reply} onChange=${e => setReply(e.target.value)} aria-label="Texto de la respuesta"></textarea>
              ${imgs.length > 0 && html`<div><div className="muted" style=${{ fontSize: 12 }}>Imágenes en el texto</div><div className="thumbs">${imgs.map((m, k) => html`<figure key=${k}><img src=${m.url} alt=${m.name} /><span>${m.name} · ${fsize(m.size)} <button className="btn" style=${{ padding: '0 4px' }} onClick=${() => setImgs(imgs.filter((_, j) => j !== k))} aria-label=${'Quitar ' + m.name}>✕</button></span></figure>`)}</div></div>`}
              ${adj.length > 0 && html`<div className="atts">${adj.map((f, k) => html`<span key=${k} className="att"><span className="ext">${ext(f.name) || 'archivo'}</span>${f.name} <span className="sz">${fsize(f.size)}</span><button onClick=${() => setAdj(adj.filter((_, j) => j !== k))} aria-label=${'Quitar ' + f.name}>✕</button></span>`)}</div>`}
              <div className="chips">
                <label className="btn outline">Adjuntar archivos<input id="reply-files" type="file" multiple onChange=${e => { addFiles(e.target.files, false); e.target.value = ''; }} /></label>
                <label className="btn outline">Insertar imagen<input id="reply-imgs" type="file" multiple accept=".png,.jpg,.jpeg,.gif" onChange=${e => { addFiles(e.target.files, true); e.target.value = ''; }} /></label>
                <span className="muted" style=${{ fontSize: 12 }}>Hasta unos 3,7 MB por archivo. <${Ask} id="adjuntos" /></span>
              </div>
              <div className="chips"><button className="btn primary" disabled=${!reply.trim()} onClick=${() => enviar(reply)}>Enviar</button><button className="btn" onClick=${closeEditor}>Descartar</button>
                <span className="muted" style=${{ fontSize: 12 }}>Sale desde el buzón del área, en el mismo hilo.</span></div>
            </div>`}
            ${[...i.ms].reverse().map(m => html`<div key=${m.id} className=${'mail' + (m.dir === 'out' ? ' out' : '')}>
              <div className="mh"><span>${m.dir === 'in' ? 'Del cliente · ' + m.de : 'Respuesta de ' + uname(m.por) + ' · desde el buzón del área'}${roundBy[m.id] != null ? html` · <b>respondió en ${dur(roundBy[m.id])}</b>` : ''}</span>
                <span className="chips">${m.estado === 'Pendiente de envío' ? html`<${Chip} k="info">Pendiente de envío</${Chip}>` : m.estado === 'Error de envío' ? html`<${Chip} k="bad">Error de envío</${Chip}>` : m.estado === 'Enviado' ? html`<${Chip} k="ok">Enviado</${Chip}>` : null}${fdt(m.fecha)}</span></div>
              <div className="subj">${m.asunto}</div>
              <div className="bodytext">${m.cuerpo}</div>
              ${m.imagenes?.length > 0 && html`<div className="thumbs">${m.imagenes.map((g, k) => html`<figure key=${k}>${g.url ? html`<img src=${g.url} alt=${g.name} />` : html`<div className="ph">imagen</div>`}<span>${g.name}</span></figure>`)}</div>`}
              ${m.adjuntos?.length > 0 && html`<div className="atts">${m.adjuntos.map((f, k) => html`<button key=${k} className="att" style=${{ cursor: 'pointer' }} onClick=${() => say(`En la app real, "${f.name}" se abre o se descarga desde el correo. Queda guardado en la solución junto con el correo y se borra con él a los 2 años.`, 'info')}><span className="ext">${ext(f.name) || 'archivo'}</span>${f.name} <span className="sz">${fsize(f.size)}</span></button>`)}</div>`}
              ${m.unidoDe && html`<div className="muted" style=${{ fontSize: 12, marginTop: 6 }}>Unido desde ${m.unidoDe}</div>`}
              ${m.estado === 'Error de envío' && html`<div className="note bad" style=${{ marginTop: 8 }}>El buzón rechazó el envío. El correo del cliente sigue sin respuesta y aparece en "Errores de envío". Responda de nuevo.</div>`}
            </div>`)}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function FinalizarModal({ id, onClose }) {
  const { db, mut, log, say } = useApp();
  const s = db.solicitudes.find(x => x.id === id); const i = convInfo(s);
  const [res, setRes] = useState(''); const [motivo, setMotivo] = useState(''); const [detalle, setDetalle] = useState('');
  const formalizados = db.arreglos.filter(a => a.solicitudId === id && a.numeroArreglo != null);
  const ok = res && (res !== 'Sin respuesta' || (motivo && detalle.trim()));
  return html`<${Modal} title="Finalizar conversación" onClose=${onClose}
    foot=${html`<button className="btn" onClick=${onClose}>Cancelar</button><button className="btn primary" disabled=${!ok} onClick=${() => { mut(n => { const t = n.solicitudes.find(x => x.id === id); t.estado = 'Finalizada'; t.resultado = res; t.fin = { uid: n._uid, fecha: now(), motivo: res === 'Sin respuesta' ? motivo : null, detalle: res === 'Sin respuesta' ? detalle : null }; log(n, 'sol', id, `Finalizó la conversación: ${res}${res === 'Sin respuesta' ? ' (' + motivo + ')' : ''}`); }); say('Conversación finalizada. Si el cliente vuelve a escribir en este hilo, se le pedirá decidir si reabrirla.'); onClose(); }}>Finalizar</button>`}>
    <p style=${{ margin: 0 }}>Queda registrado el resultado, quién finalizó y cuándo. El tiempo total se mide desde el primer correo (${fdt(s.llegada)}) hasta ahora: <b>${dur((now() - s.llegada) / 60000)}</b>.</p>
    <${Field} label=${html`Resultado <span className="req">*</span>`}><select id="fin-res" value=${res} onChange=${e => setRes(e.target.value)}><option value="">Elegir…</option>${['Con arreglo de pago', 'Sin arreglo de pago', 'Sin respuesta'].map(m => html`<option key=${m}>${m}</option>`)}</select></${Field}>
    ${res === 'Con arreglo de pago' && !formalizados.length && html`<div className="note warn">Esta conversación no tiene un arreglo formalizado. <${Ask} id="con-arreglo" /></div>`}
    ${i.pend && res && res !== 'Sin respuesta' && html`<div className="note warn">El último correo del cliente todavía no tiene respuesta.</div>`}
    ${res === 'Sin respuesta' && html`
      <${Field} label=${html`Motivo <span className="req">*</span>`}><select id="fin-motivo" value=${motivo} onChange=${e => setMotivo(e.target.value)}><option value="">Elegir…</option>${['Spam', 'Respuesta automática', 'El cliente no respondió', 'Otro'].map(m => html`<option key=${m}>${m}</option>`)}</select></${Field}>
      <${Field} label=${html`Detalle <span className="req">*</span>`}><textarea id="fin-detalle" rows="3" value=${detalle} onChange=${e => setDetalle(e.target.value)}></textarea></${Field}>`}
  </${Modal}>`;
}
function UnirModal({ id, onClose }) {
  const { db, mut, log, go, say } = useApp();
  const s = db.solicitudes.find(x => x.id === id);
  const [q, setQ] = useState('');
  const same = x => x.mails[0].de === s.mails[0].de || (s.clienteId && x.clienteId === s.clienteId);
  const cands = db.solicitudes.filter(x => x.id !== id && x.estado === 'Abierta' && (same(x) || (q.length >= 2 && [x.num, x.mails[0].de, x.mails[0].asunto].some(f => norm(f).includes(norm(q))))))
    .sort((a, b) => (same(b) - same(a)) || (b.llegada - a.llegada));
  const unir = t => {
    mut(n => { const src = n.solicitudes.find(x => x.id === id), dst = n.solicitudes.find(x => x.id === t.id);
      dst.mails.push(...src.mails.map(m => ({ ...m, unidoDe: src.num }))); dst.llegada = mailsSorted(dst)[0].fecha;
      if (!dst.clienteId && src.clienteId) dst.clienteId = src.clienteId; if (!dst.asignado && src.asignado) dst.asignado = src.asignado;
      n.arreglos.filter(a => a.solicitudId === id).forEach(a => { a.solicitudId = t.id; });
      src.estado = 'Unida'; src.unidaA = t.id; src.mails = [];
      log(n, 'sol', id, `Unió esta conversación a ${dst.num}`); log(n, 'sol', t.id, `Recibió los correos de ${src.num}`); });
    say(`Conversaciones unidas. Los correos quedaron en ${t.num}, ordenados por fecha.`); onClose(); setTimeout(() => go({ p: 'sol', id: t.id }), 0);
  };
  return html`<${Modal} title="Unir a otra conversación" onClose=${onClose}>
    <p style=${{ margin: 0 }}>Los correos de <b>${s.num}</b> pasan a la conversación que elija. Primero se muestran las conversaciones abiertas del mismo cliente.</p>
    <${Field} label="Buscar otra conversación abierta (n.º, remitente o asunto)"><input id="unir-q" value=${q} onChange=${e => setQ(e.target.value)} /></${Field}>
    <${Grid} rows=${cands} onOpen=${unir} empty="No hay otras conversaciones abiertas de este cliente. Busque por número o asunto."
      cols=${[{ h: 'N.º', r: x => html`<span className="mono">${x.num}</span>` }, { h: 'Asunto', r: x => x.mails[0].asunto }, { h: 'Primer correo', r: x => fdt(x.llegada) }, { h: '', r: x => same(x) ? html`<${Chip} k="acc">Mismo cliente</${Chip}>` : null }]} />
  </${Modal}>`;
}

function ClienteForm({ id, correo, fromSol }) {
  const { db, mut, log, go, say } = useApp();

/* ---------- Vista previa del formato ---------- */
function fieldVal(campo, d) {
  const a = d.a, c = d.cli;
  switch (campo) {
    case 'fechaFormalizacion': return fd(a.fechaFormalizacion); case 'oficial': return uname(a.oficial);
    case 'clienteNombre': return c.nombre; case 'clienteCedula': return c.cedula; case 'clienteCorreo': return c.correo; case 'clienteCelular': return c.celular;
    case 'numeroProducto': return a.numeroProducto; case 'tipo': return a.tipo; case 'numeroArreglo': return String(a.numeroArreglo ?? a.numeroImpreso ?? d.provisional);
    case 'saldoInicial': return n2(a.saldoInicial); case 'montoAbonado': return n2(a.montoAbonado); case 'saldoRemanente': return n2(a.saldoRemanente);
    case 'plazo': return String(a.plazo); case 'cuota': return n2(a.cuota); case 'totalPagar': return n2(a.totalPagar);
    case 'fechaInicio': return fd(a.fechaInicio); case 'fechaFin': return fd(a.fechaFin); case 'cuentaDebitar': return a.cuentaDebitar; case 'comentarios': return a.comentarios || '';
    case 'total.montoCuotas': return n2(a.cuotas.reduce((t, q) => t + q.monto, 0)); case 'total.montoPagado': return n2(a.cuotas.reduce((t, q) => t + (q.montoPagado || 0), 0));
    default: return '';
  }
}
const blockVal = (campo, q) => ({ 'cuota.numero': String(q.n), 'cuota.fecha': fd(q.fecha), 'cuota.monto': n2(q.monto), 'cuota.fechaPago': fd(q.fechaPago), 'cuota.montoPagado': q.montoPagado != null ? n2(q.montoPagado) : '' })[campo] ?? '';
function Sheet({ sheetKey, ver, data, coords }) {
  const t = template(ver)[sheetKey]; const L = 'ABCDEF'.slice(0, t.cols).split('');
  const cells = {};
  for (const [k, v] of Object.entries(t.cells)) cells[k] = typeof v === 'string' ? { t: v, cls: 'lbl' } : { ...v };
  for (const m of ver.mapeo.filter(m => m.hoja === sheetKey)) {
    const p = parseCell(m.celda); if (!p) continue;
    if (FIELD[m.campo]?.tipo === 'bloque') data.a.cuotas.forEach((q, i) => { cells[p.col + (p.row + i)] = { t: blockVal(m.campo, q), cls: 'val', coord: p.col + (p.row + i), num: m.campo !== 'cuota.fecha' && m.campo !== 'cuota.fechaPago' }; });
    else cells[p.col + p.row] = { t: fieldVal(m.campo, data), cls: 'val', coord: p.col + p.row, span: m.campo === 'comentarios' ? t.cols : 1, h: m.campo === 'comentarios' ? 70 : null };
  }
  const rows = [...new Set(Object.keys(cells).map(k => parseCell(k).row))].sort((a, b) => a - b);
  const out = []; let prev = null;
  const blockEnd = t.block ? t.block[0] - 1 + data.a.cuotas.length : null;
  rows.forEach(r => {
    if (prev !== null && r - prev > 1) {
      if (t.block && prev === blockEnd && r > t.block[1]) out.push(html`<tr key=${'clr' + r} className="cleared"><th className="rn"></th><td colSpan=${t.cols}>Filas ${blockEnd + 1} a ${t.block[1]} de la plantilla: vacías (el generador limpia las filas que el plazo no usa)</td></tr>`);
      else out.push(html`<tr key=${'gap' + r} className="gap"><th className="rn"></th><td colSpan=${t.cols}></td></tr>`);
    }
    const tds = []; let skip = 0;
    L.forEach((col, ci) => {
      if (skip > 0) { skip--; return; }
      const k = col + r, c = cells[k];
      if (!c) { tds.push(html`<td key=${k}></td>`); return; }
      const span = Math.min(c.span || 1, t.cols - ci); skip = span - 1;
      tds.push(html`<td key=${k} colSpan=${span} className=${(c.cls || '') + (c.num ? ' num' : '')} style=${c.h ? { height: c.h } : null}>${coords && c.coord ? html`<span className="coord">${c.coord}</span>` : null}${c.t}</td>`);
    });
    out.push(html`<tr key=${r}><th className="rn">${r}</th>${tds}</tr>`); prev = r;
  });
  return html`<div className="paper"><table className=${'sheet' + (coords ? ' coords' : '')}><thead><tr><th className="rn"></th>${L.map(l => html`<th key=${l}>${l}</th>`)}</tr></thead><tbody>${out}</tbody></table></div>`;
}

  const since = x => x.i.pend || x.i.nuevos[0]?.fecha;
  const pend = conv.filter(x => needsAttention(x.s, x.i)).sort((a, b) => since(a) - since(b));
  const desde = new Date(now().getTime() - 30 * 86400000);
  const rounds = conv.flatMap(x => x.i.rounds).filter(r => r.fecha >= desde);
  const fins = conv.filter(x => x.s.fin && x.s.fin.fecha >= desde);
  const finsT = fins.filter(x => x.s.resultado !== 'Sin respuesta');

  const decision = conv.filter(x => x.i.nuevos.length);

      <div className="tile"><div className="k">Tiempo total promedio, 30 días <${Ask} id="tiempo-total" /></div><div className="n">${totAvg != null ? dur(totAvg) : '—'}</div></div>
    </div>
    <div className="cols">
      <div className="panel"><h3>Sin respuesta, por antigüedad <${Ask} id="umbrales" /></h3>
        <${Grid} rows=${pend.map(x => ({ ...x, id: x.s.id }))} onOpen=${x => go({ p: 'sol', id: x.s.id })} empty=${html`<b>Sin pendientes.</b>Todos los correos tienen respuesta.`}
          cols=${[{ h: 'Desde', r: x => fdt(since(x)) }, { h: 'Asunto', r: x => x.s.mails[0].asunto }, { h: 'Oficial', r: x => x.s.asignado ? uname(x.s.asignado) : html`<${Chip} k="warn">Sin asignar</${Chip}>` }, { h: 'Antigüedad', r: x => html`<div className="chips">${ageChip((now() - since(x)) / 60000)}${x.i.nuevos.length ? html`<${Chip} k="bad">En finalizada</${Chip}>` : null}</div>` }]} /></div>

function validarVersion(v) {
  const errs = []; const seen = {};
  const occupy = (hoja, cell, who) => { const k = hoja + '!' + cell; if (seen[k]) errs.push(`${HOJAS[hoja]}, celda ${cell}: tiene dos campos ("${FIELD[seen[k]].label}" y "${FIELD[who].label}").`); else seen[k] = who; };
  v.mapeo.forEach(m => {
    const p = parseCell(m.celda);
    if (!m.campo) { errs.push('Hay una fila de mapeo sin campo.'); return; }
    if (!p) { errs.push(`"${m.celda}" no es una celda válida (ej.: B7).`); return; }
    if (FIELD[m.campo].tipo === 'bloque') { for (let i = 0; i < v.capacidad; i++) occupy(m.hoja, p.col + (p.row + i), m.campo); }
    else occupy(m.hoja, p.col + p.row, m.campo);
  });
  const blk = v.mapeo.filter(m => FIELD[m.campo]?.tipo === 'bloque');
  const miss = FIELDS.filter(f => f[2] === 'bloque').map(f => f[0]).filter(r => !blk.some(m => m.campo === r));
  if (miss.length) errs.push(`El bloque de cuotas está incompleto: falta ${miss.map(x => FIELD[x].label).join(', ')}.`);
  if (new Set(blk.map(m => parseCell(m.celda)?.row)).size > 1) errs.push('Las columnas del bloque de cuotas no empiezan en la misma fila.');
  if (v.capacidad < 1 || v.capacidad > 60) errs.push('La capacidad de cuotas debe estar entre 1 y 60.');
  return errs;
}

    : M.k === 'reasignar' ? html`<${ReasignarModal} id=${M.id} onClose=${close} />`
    : M.k === 'vincular' ? html`<${VincularModal} id=${M.id} onClose=${close} />`
    : M.k === 'formato' ? html`<${FormatoModal} id=${M.id} verId=${M.ver} preview=${M.preview} onClose=${close} />`
    : M.k === 'anular' ? html`<${MotivoModal} title="Anular arreglo" cta="Anular arreglo" intro="La anulación no se puede revertir. La gestión de cobro sigue por Cobranza. Si el cliente vuelve a negociar, se registra un arreglo nuevo con el siguiente número." onClose=${close}
        onOk=${m => { mut(n => { const t = n.arreglos.find(x => x.id === M.id); t.estado = 'Anulado'; t.anulacion = { motivo: m, uid, fecha: now() }; t.fechaTermino = now(); log(n, 'arr', M.id, 'Anuló el arreglo. Motivo: ' + m); }); say('Arreglo anulado.'); }} />`
    : M.k === 'descartar' ? html`<${MotivoModal} title="Descartar borrador" cta="Descartar" intro="El borrador queda como descartado en el historial del cliente, sin número de arreglo. No se puede recuperar: si el cliente vuelve, se crea un borrador nuevo." onClose=${close}
        onOk=${m => { mut(n => { const t = n.arreglos.find(x => x.id === M.id); t.estado = 'Descartado'; t.descarte = { motivo: m, uid, fecha: now() }; t.numeroImpreso = null; log(n, 'arr', M.id, 'Descartó el borrador. Motivo: ' + m); }); say('Borrador descartado. No consumió número de arreglo.'); }} />`
    : M.k === 'reabrir' ? html`<${MotivoModal} title="Reabrir arreglo" cta="Reabrir" intro="Reabrir vuelve el arreglo a Vigente y descongela sus datos para corregirlos. El próximo formato que se genere lo congela de nuevo con los datos actuales del cliente." onClose=${close}
        onOk=${m => { mut(n => { const t = n.arreglos.find(x => x.id === M.id); t.estado = 'Vigente'; t.congelado = null; t.instantanea = null; t.fechaTermino = null; t.reaperturas = (t.reaperturas || 0) + 1; t.reapertura = { motivo: m, uid, fecha: now() }; log(n, 'arr', M.id, 'Reabrió el arreglo. Motivo: ' + m); }); say('Arreglo reabierto. Sus datos se pueden corregir.'); }} />`
    : M.k === 'desbloquear' ? html`<${Modal} title="Desbloquear borrador" onClose=${close}
        foot=${html`<button className="btn" onClick=${close}>Cancelar</button><button className="btn primary" onClick=${() => { mut(n => { const t = n.arreglos.find(x => x.id === M.id); t.congelado = null; t.instantanea = null; t.numeroImpreso = null; log(n, 'arr', M.id, 'Desbloqueó el borrador para corregirlo antes de la firma'); }); close(); say('Borrador desbloqueado. Después de corregir, vuelva a imprimir el formato.'); }}>Desbloquear</button>`}>
        <p style=${{ margin: 0 }}>El formato que ya se imprimió deja de ser válido: no lo haga firmar. Después de corregir, genere el formato de nuevo. <${Ask} id="firma-bloqueo" /></p></${Modal}>`
    : M.k === 'formalizar' ? (() => { const a = db.arreglos.find(x => x.id === M.id); const k = sigNumeroArreglo(db, a.producto, a.numeroProducto); const ok = k === a.numeroImpreso;
        return html`<${Modal} title="Formalizar arreglo" onClose=${close}
          foot=${html`<button className="btn" onClick=${close}>Cancelar</button><button className="btn primary" disabled=${!ok} onClick=${() => { mut(n => { const t = n.arreglos.find(x => x.id === M.id); t.numeroArreglo = sigNumeroArreglo(n, t.producto, t.numeroProducto); t.estado = 'Vigente'; log(n, 'arr', M.id, `Formalizó el arreglo con el N.º ${t.numeroArreglo}: el cliente firmó`); }); close(); say(`Arreglo formalizado con el N.º ${k}. Ya cuenta para el seguimiento de cuotas.`); }}>El cliente firmó: formalizar</button>`}>
          ${ok ? html`<p style=${{ margin: 0 }}>Confirme que el cliente firmó el formato impreso el ${fdt(a.congelado)}. Al formalizar:</p>
            <ul style=${{ margin: 0, paddingLeft: 18 }}><li>Toma el número de arreglo <b>${k}</b>, el mismo que se imprimió.</li><li>Pasa a Vigente y sus cuotas cuentan para la lista de riesgo.</li><li>Después, solo la jefatura puede reabrirlo, con motivo.</li></ul>`
          : html`<div className="note bad">Mientras tanto se formalizó otro arreglo de este crédito. El formato impreso dice N.º ${a.numeroImpreso}, pero el número libre ahora es ${k}. Desbloquee el borrador, vuelva a imprimir y haga firmar el formato nuevo.</div>`}
          <${Ask} id="numero-borrador" /></${Modal}>`; })()
    : M.k === 'confirmFreeze' ? (() => { const a = db.arreglos.find(x => x.id === M.id); const b = a.estado === 'Borrador';
        return html`<${Modal} title=${b ? 'Generar formato para firma' : 'Generar formato y congelar datos'} onClose=${close}
        foot=${html`<button className="btn" onClick=${close}>Cancelar</button><button className="btn primary" onClick=${() => {
          mut(n => { const t = freezeNow(n, M.id); log(n, 'arr', M.id, b ? `Generó el formato para firma con la plantilla ${t.version}; los datos quedaron bloqueados` : `Generó el formato con la plantilla ${t.version}; los datos quedaron congelados`); });
          setModal({ k: 'formato', id: M.id, ver: a.version }); say(b ? 'Formato generado para firma. El borrador quedó bloqueado.' : 'Formato generado. Los datos quedaron congelados.'); }}>Generar</button>`}>
        ${b ? html`<p style=${{ margin: 0 }}>Al generar el formato para firma:</p>
          <ul style=${{ margin: 0, paddingLeft: 18 }}><li>Se imprime con el número de arreglo provisional <b>${sigNumeroArreglo(db, a.producto, a.numeroProducto)}</b>.</li><li>Los datos del borrador y del cliente se bloquean, para que coincidan con lo que se firma.</li><li>Cuando el cliente firme, use "Formalizar". Si pide un cambio antes, use "Desbloquear para corregir".</li></ul>`
        : html`<p style=${{ margin: 0 }}>El arreglo fue reabierto. Al generar el formato, sus datos y los del cliente quedan congelados de nuevo.</p>`}
        <${Ask} id=${b ? 'firma-bloqueo' : 'numero-borrador'} /></${Modal}>`; })()
    : null;

  return html`<${Ctx.Provider} value=${ctx}><div className="app">
    <header className="top">
      <button className="tbtn menu-btn" onClick=${() => setNavOpen(!navOpen)} aria-expanded=${navOpen}>Menú</button>
      <span className="brand">Control de Arreglos de Pago</span><span className="sim">Mockup v3 · datos ficticios</span>
      <span className="spacer"></span>
      <span className="clock">Hoy simulado: ${fdt(now())}</span>
      <button className="tbtn" onClick=${simular}>Simular correo entrante</button>
      <label style=${{ display: 'inline-flex', gap: 6, alignItems: 'center' }}><span className="clock">Ver como</span>
        <select id="user-switch" value=${uid} onChange=${e => { setUid(e.target.value); setModal(null); }}>${Object.values(USERS).map(u => html`<option key=${u.id} value=${u.id}>${u.nombre} · ${u.rol === 'Jefe' ? 'Jefatura' : 'Oficial'}</option>`)}</select></label>
    </header>
    <form className="searchbar" onSubmit=${e => { e.preventDefault(); go({ p: 'buscar', q: q.trim() }); }}>
      <input id="global-search" type="search" value=${q} onChange=${e => setQ(e.target.value)} placeholder="Buscar por cédula o número de préstamo o tarjeta" aria-label="Buscar historial" />
      <button className="btn outline" type="submit">Buscar</button>
    </form>
    <div className="body">
      <nav className=${'nav' + (navOpen ? ' open' : '')} aria-label="Navegación">
        ${NAV.map(([g, items]) => html`<div key=${g}><h4>${g}</h4>${items.map(([k, lbl, to, cnt, bad]) => html`<button key=${k} className=${active(k) ? 'on' : ''} onClick=${() => go(to)}><span>${lbl}</span>${cnt ? html`<span className=${'count' + (bad ? ' bad' : '')}>${cnt}</span>` : null}</button>`)}</div>`)}
      </nav>
      <main className="main">${page}</main>
    </div>
    ${modalEl}
    ${toast && html`<div key=${toast.k} className=${'toast ' + toast.kind} role="status">${toast.msg}</div>`}
  </div></${Ctx.Provider}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
